<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="120" height="140">
  <title>Escudo do Estado do Paraná (placeholder)</title>
  <defs>
    <linearGradient id="ceu-pr" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#4a9de6"/>
      <stop offset="1" stop-color="#1e5aa0"/>
    </linearGradient>
    <linearGradient id="verde-pr" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#2f8b3d"/>
      <stop offset="1" stop-color="#1a5c26"/>
    </linearGradient>
  </defs>
  <!-- escudo -->
  <path d="M10 20 Q10 10 20 10 L100 10 Q110 10 110 20 L110 90 Q110 120 60 135 Q10 120 10 90 Z"
        fill="url(#ceu-pr)" stroke="#0b2b56" stroke-width="2"/>
  <!-- faixa verde inferior representando as araucárias -->
  <path d="M10 90 Q10 120 60 135 Q110 120 110 90 Z"
        fill="url(#verde-pr)" stroke="#0b2b56" stroke-width="1.5"/>
  <!-- estrelas do Cruzeiro do Sul (5 estrelas brancas) -->
  <g fill="#fff">
    <circle cx="60" cy="35" r="3"/>
    <circle cx="48" cy="50" r="2"/>
    <circle cx="72" cy="50" r="2"/>
    <circle cx="60" cy="58" r="2"/>
    <circle cx="60" cy="72" r="1.5"/>
  </g>
  <!-- silhueta simplificada de araucária -->
  <g transform="translate(60,108)" fill="#e8f0d8" opacity="0.85">
    <rect x="-1.5" y="-2" width="3" height="18" rx="0.5"/>
    <path d="M-14 -2 Q0 -12 14 -2 L10 -2 Q0 -8 -10 -2 Z"/>
    <path d="M-11 -8 Q0 -18 11 -8 L8 -8 Q0 -14 -8 -8 Z"/>
    <path d="M-8 -14 Q0 -22 8 -14 L6 -14 Q0 -19 -6 -14 Z"/>
  </g>
  <!-- letras PR discretas -->
  <text x="60" y="128" text-anchor="middle" font-family="DM Sans, sans-serif"
        font-size="8" font-weight="700" fill="#fff" opacity="0.85">PARANÁ</text>
</svg>
